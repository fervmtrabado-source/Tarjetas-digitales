<title>Lorena Soria · Tarjeta digital</title>
<style>
:root{--wine:#751830;--wine2:#4b1025;--red:#c13b38;--cream:#fcf7f1;--ink:#2d2929;--gold:#d7aa79}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(ellipse at 20% 7%,#fffdf9 0,transparent 53%),radial-gradient(ellipse at 80% 86%,#e5d1cb 0,transparent 47%),#f0e6de;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
main.stage{width:100%;height:100dvh;min-height:0;display:flex;align-items:center;justify-content:center;padding:9px 7px max(9px,env(safe-area-inset-bottom));perspective:1600px}
.scene{height:min(calc(100dvh - 22px),850px,calc((100vw - 14px)*1.7747));aspect-ratio:941/1670;position:relative;max-width:480px;min-width:0;container-type:inline-size;filter:drop-shadow(0 12px 28px rgba(67,30,37,.25))}
.shell{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.24,.75,.22,1);border-radius:15px}
.scene.is-flipped .shell{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:15px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(.1px)}
.front{background:#fff2e8;cursor:pointer}
.front img.poster{width:100%;height:100%;display:block;object-fit:cover}
.back{transform:rotateY(180deg) translateZ(.1px);display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,#fffdfa 0%,#fcf6f0 46%,#f3e7e1 100%);border:1px solid #e4cec6;padding:9% 8% 7%;isolation:isolate}
.back:before{content:"";z-index:-1;position:absolute;left:-40%;top:29%;width:180%;height:49%;transform:rotate(-13deg);background:linear-gradient(180deg,transparent 0%,#e8d0c43d 43%,#a73e4314 49%,transparent 78%);border-radius:50%}
.back:after{content:"";z-index:-2;position:absolute;right:-38%;top:20%;height:58%;width:128%;border:calc(.6cqw + 1px) solid #9f39421b;border-radius:50%;transform:rotate(-26deg)}
.flip{position:absolute;right:5%;bottom:3.2%;z-index:10;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid rgba(255,255,255,.6);border-radius:99px;cursor:pointer;min-height:40px;padding:8px 12px;background:#fffaf7f0;color:var(--wine);font-size:clamp(11px,2.8cqw,14px);font-weight:750;box-shadow:0 6px 20px #240d122e;backdrop-filter:blur(12px)}
.flip:focus-visible,.action:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.flip-back{position:absolute;top:4%;bottom:auto;right:5%;font-size:clamp(10px,2.5cqw,12px);padding:6px 11px;min-height:36px;background:#fffaf7;color:var(--wine);box-shadow:none;border-color:#dfc9c2}
.back-top{display:flex;align-items:center;flex-direction:column;gap:8px;padding-top:3.5%}
.back-logo{width:69%;max-height:100px;object-fit:contain}
.back-top small{color:#957c76;text-transform:uppercase;letter-spacing:.22em;font-size:clamp(9px,2.2cqw,12px);font-weight:700}
.back-divider{width:20%;height:1px;background:var(--red);opacity:.7;margin-top:3%}
.quote{margin:0 auto;width:100%;text-align:center;padding:0 3%}
.quote-mark{font:italic 700 clamp(31px,11cqw,53px)/.75 Georgia,serif;color:#b85d59;opacity:.65}
.quote h1{font:normal clamp(23px,7.8cqw,39px)/1.11 Georgia,'Times New Roman',serif;letter-spacing:-.035em;color:var(--wine);margin:0 auto 5%}
.quote h1 em{font-weight:normal;color:#302227;font-style:italic}
.quote p{font-size:clamp(10px,2.75cqw,13px);color:#78625c;line-height:1.45;margin:0 auto;max-width:95%}
.contact-area{display:flex;flex-direction:column;gap:clamp(6px,1.7cqw,10px)}
.area-label{text-transform:uppercase;letter-spacing:.28em;color:var(--wine);font-size:clamp(9px,2.5cqw,11px);font-weight:800;text-align:center;margin:0 0 4px}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(7px,1.9cqw,10px)}
.action{display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid #e2cfc5;background:#fffdfb9e;border-radius:12px;min-height:clamp(45px,12cqw,60px);color:var(--wine);font-size:clamp(11px,2.8cqw,14px);font-weight:750;text-decoration:none;cursor:pointer;text-align:center;padding:10px 6px;font-family:inherit}
.action svg{width:19px;height:19px;flex:none}
.action.wa{background:var(--wine);color:#fff;border-color:var(--wine)}
.contact-details{display:flex;flex-direction:column;gap:3px;margin-top:2%;font-size:clamp(10px,2.5cqw,12px);color:#5e4f4c;text-align:center}
.contact-details b{color:var(--wine);font-size:clamp(13px,3.5cqw,17px);letter-spacing:.025em}
.contact-details .pending{color:#937e78;margin-top:2px}
.footer-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.footer-actions .action{min-height:clamp(42px,11.5cqw,56px);background:#faf2edc4}
.footer-actions .action.share{color:#fff;background:linear-gradient(100deg,#9e1e3a,#69182e);border-color:transparent}
.brand-footer{display:flex;justify-content:center;align-items:center;text-transform:uppercase;letter-spacing:.16em;color:#9d8980;font-weight:650;font-size:clamp(8px,2.1cqw,11px);padding-top:2%}
.toast{position:absolute;left:50%;bottom:15%;transform:translateX(-50%);z-index:12;white-space:nowrap;background:#321a22;color:white;border-radius:30px;padding:11px 14px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.visible{opacity:1}
@media(max-height:650px){.back{padding-top:6%;padding-bottom:5%}.back-top{gap:1px}.back-logo{width:60%;max-height:65px}.quote h1{margin-bottom:2%}.quote-mark{font-size:28px}.quote p{line-height:1.25}.contact-grid .action,.footer-actions .action{min-height:41px}.contact-details{margin-top:0}}
@media(prefers-reduced-motion:reduce){.shell{transition:none}}

/* Edición final: contacto visible, estética editorial y lectura compacta. */
.contact-details{margin-top:0;gap:7px;width:100%;align-items:stretch;text-align:center}
.contact-phone{font-weight:750;color:var(--wine);font-size:clamp(13px,3.5cqw,17px);text-decoration:none;letter-spacing:.025em}
.contact-email{display:flex;align-items:center;gap:8px;text-align:left;width:100%;padding:9px 11px;border-radius:11px;border:1px solid #e3cbc2;background:linear-gradient(105deg,#fffdfbdf,#faeee8f5);color:#773043;text-decoration:none;min-height:49px}
.contact-email svg{height:21px;width:21px;flex-shrink:0;color:#aa4e53}
.email-copy{display:flex;min-width:0;flex:1;flex-direction:column;gap:3px}
.email-copy small{font-size:clamp(8px,1.9cqw,10px);letter-spacing:.13em;font-weight:800;color:#a47c79}
.email-copy strong{font-size:clamp(9.1px,2.37cqw,12px);font-weight:650;overflow-wrap:anywhere;line-height:1.2;color:#6e263a;letter-spacing:-.02em}
.email-arrow{font-size:18px;color:#9d5761;flex-shrink:0}
.email-copy strong{overflow-wrap:normal;word-break:normal;font-size:clamp(8.6px,2.3cqw,11px)}
.contact-email:focus-visible,.contact-phone:focus-visible,.flip-back:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.contact-area{gap:clamp(5px,1.4cqw,9px)}
.area-label{margin-bottom:2px}
.back{padding-top:7.2%;padding-bottom:5.5%}
.back-logo{width:64%}
.back-divider{margin-top:1.3%}
@media(max-height:690px){.back{padding:5.5% 7.5% 4.5%}.back-top{gap:2px}.back-logo{width:58%;max-height:75px}.quote-mark{font-size:28px}.quote h1{font-size:clamp(20px,6.4cqw,29px);margin-bottom:3%}.quote p{font-size:clamp(10px,2.7cqw,12px);line-height:1.3}.area-label{margin-bottom:0}.contact-area{gap:5px}.contact-grid .action{min-height:38px;padding:6px 5px}.contact-email{min-height:38px;padding:6px 8px}.email-copy small{font-size:8px}.email-copy strong{font-size:clamp(8.3px,2.18cqw,10px)}.contact-details{gap:3px}.contact-phone{font-size:12px}.footer-actions .action{min-height:38px;padding:5px 3px}.brand-footer{font-size:8px}}
@media(max-height:535px){.quote p{font-size:9px}.quote h1{font-size:21px}.quote-mark{display:none}.back-top{padding-top:1%}.back-logo{width:48%}.back-divider{display:none}.brand-footer{display:none}.back .footer-actions .action{min-height:34px}.contact-email{min-height:34px}}

/* ÚNICO CAMBIO: micro-indicador TAP sobre el diseño anterior. */
.front .flip.flip-micro {
  position:absolute;right:3.8%;bottom:2.05%;
  display:flex;justify-content:center;align-items:center;
  width:clamp(64px,24cqw,99px);height:clamp(38px,10cqw,46px);min-height:0;
  padding:0;margin:0;gap:0; border:0;border-radius:0;
  background:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;
  overflow:visible;isolation:isolate;
  animation:tap-glimmer 4s ease-in-out infinite;
}
.front .flip.flip-micro .tap-art { display:block; width:100%;height:100%;object-fit:contain;pointer-events:none; }
.front .flip.flip-micro:hover { transform:scale(1.07); }
.front .flip.flip-micro:focus-visible{outline:2px solid #f7e5b9;outline-offset:3px;border-radius:20px;}
@keyframes tap-glimmer {
  0%,14%,77%,100% {opacity:.77;filter:brightness(.89) drop-shadow(0 0 0 transparent);}
  41% {opacity:1;filter:brightness(1.34) drop-shadow(0 0 6px rgba(255,218,167,.55));}
  57% {opacity:.92;filter:brightness(1.07) drop-shadow(0 0 2px rgba(255,218,167,.3));}
}
@media (prefers-reduced-motion: reduce){.front .flip.flip-micro{animation:none;opacity:1}}
</style>
</head>

 try {if(navigator.share){await navigator.share(data);return}} catch(e){if(e.name==='AbortError')return}
 try {await navigator.clipboard.writeText(data.url);notify('Enlace copiado ✓')}
 catch(e){const input=document.createElement('input');input.value=data.url;document.body.appendChild(input);input.select();try{document.execCommand('copy');notify('Enlace copiado ✓')}catch(err){window.prompt('Copia el enlace',data.url)}input.remove()}
});
